<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates | Vivek Jaiswal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --bg:#09090b;
  --surface:#111114;
  --surface-2:#17171b;
  --text:#f5f5f5;
  --muted:#a1a1aa;
  --line:rgba(255,255,255,.10);
  --accent:#8b5cf6;
  --accent-2:#22d3ee;
  --radius:22px;
  --shadow:0 20px 60px rgba(0,0,0,.35);
  --ease:cubic-bezier(.2,.7,.2,1);
}
body:not(.dark){
  --bg:#f7f7f5;
  --surface:#fff;
  --surface-2:#f1f1ef;
  --text:#18181b;
  --muted:#66666f;
  --line:rgba(24,24,27,.10);
  --shadow:0 20px 50px rgba(24,24,27,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"DM Sans",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
}
body.dark{background:var(--bg);color:var(--text)}
a{color:inherit}
button,input{font:inherit}
.navbar{
  position:sticky;top:0;z-index:1000;width:100%;
  padding:16px 5%;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(18px);border-bottom:1px solid var(--line);
}
.nav-logo{font-family:"Space Grotesk",sans-serif;font-size:1.05rem;font-weight:700;text-decoration:none;letter-spacing:-.02em}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none}
.nav-links a{font-size:.9rem;color:var(--muted);text-decoration:none;transition:.25s}
.nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--text)}
.theme-toggle{
  width:42px;height:42px;padding:0;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  color:#f8fafc;cursor:pointer;
  transition:border-color .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease;
}
.theme-toggle:hover{border-color:rgba(124,92,255,.55);box-shadow:0 0 24px rgba(124,92,255,.16)}
.theme-toggle i{font-size:15px}
body:not(.dark) .theme-toggle{background:rgba(255,255,255,.82);border-color:rgba(17,24,39,.12);color:#111827}

.container{max-width:1200px;margin:auto;padding:0 5%}
.header{padding:95px 0 45px}
.header-badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 12px;
  border:1px solid var(--line);border-radius:99px;color:var(--muted);
  font-size:.78rem;margin-bottom:18px;background:var(--surface);
}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-2)}
.header h1{
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(2.7rem,7vw,5.2rem);line-height:1;
  letter-spacing:-.05em;margin-bottom:18px;
}
.header h1::after{
  content:"";display:block;width:55px;height:2px;margin-top:22px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
}
.header p{color:var(--muted);max-width:650px;font-size:1rem}

.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px;border:1px solid var(--line);border-radius:18px;
  background:var(--surface);margin-bottom:25px;
}
.search-box{flex:1;min-width:240px;position:relative}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
.search-input{
  width:100%;padding:11px 14px 11px 38px;background:var(--bg);
  border:1px solid var(--line);border-radius:11px;color:var(--text);outline:none;
}
.search-input:focus{border-color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{
  padding:9px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--muted);cursor:pointer;transition:.25s;
}
.filter-btn:hover,.filter-btn.active{
  border-color:rgba(139,92,246,.5);
  background:rgba(139,92,246,.12);color:var(--text);
}

.certificates-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;padding-bottom:80px;
}
.cert-card{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);
  transition:transform .35s var(--ease),border-color .35s,box-shadow .35s;
}
.cert-card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.45);box-shadow:var(--shadow)}
.cert-image-wrap{position:relative;height:220px;background:var(--surface-2);overflow:hidden}
.cert-image{width:100%;height:100%;object-fit:cover;display:block}
.category-tag{
  position:absolute;top:16px;left:16px;padding:6px 10px;
  border:1px solid rgba(255,255,255,.16);border-radius:99px;
  background:rgba(10,10,12,.65);backdrop-filter:blur(8px);
  color:#fff;font-size:.72rem;font-weight:600;
}
.cert-content{padding:24px}
.cert-heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.cert-heading h2{font-family:"Space Grotesk",sans-serif;font-size:1.25rem;line-height:1.25}
.issuer{margin-top:4px;color:var(--muted);font-size:.88rem}
.date{white-space:nowrap;color:var(--muted);font-size:.78rem;padding-top:3px}
.credential{margin:17px 0;color:var(--muted);font-size:.78rem;word-break:break-word}
.skills{display:flex;flex-wrap:wrap;gap:7px}
.skills span{
  padding:5px 9px;border:1px solid var(--line);border-radius:99px;
  background:var(--surface-2);color:var(--muted);font-size:.72rem;
}
.details-btn{
  margin-top:20px;border:1px solid var(--line);background:transparent;
  color:var(--text);border-radius:11px;padding:10px 14px;cursor:pointer;
  transition:.25s;
}
.details-btn:hover{border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.10)}
.details-btn i{margin-left:7px;font-size:.72rem}

.empty-state{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
.empty-state i{font-size:2rem;margin-bottom:12px;color:var(--accent)}
.empty-state h3{font-family:"Space Grotesk",sans-serif;color:var(--text);margin-bottom:5px}

.modal-overlay{
  position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);
  opacity:0;visibility:hidden;pointer-events:none;transition:.25s;
}
.modal-overlay.active{opacity:1;visibility:visible;pointer-events:auto}
.modal{
  position:relative;width:min(680px,100%);max-height:88vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.modal-header{display:flex;justify-content:space-between;gap:20px;padding:25px 28px;border-bottom:1px solid var(--line)}
.modal-title h2{font-family:"Space Grotesk",sans-serif;font-size:1.4rem}
.modal-subtitle{color:var(--muted);margin-top:3px}
.close-btn{
  width:38px;height:38px;flex:none;border-radius:10px;
  background:var(--bg);border:1px solid var(--line);color:var(--text);cursor:pointer;
}
.modal-body{padding:28px}
.modal-cert-image{width:100%;max-height:330px;object-fit:contain;border-radius:14px;background:var(--surface-2);margin-bottom:25px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:25px}
.detail-grid div{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.detail-grid span{display:block;color:var(--muted);font-size:.7rem;margin-bottom:4px}
.detail-grid strong{font-size:.82rem;word-break:break-word}
.modal-body h3{font-family:"Space Grotesk",sans-serif;margin-bottom:12px}
.modal-skills{margin-bottom:5px}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}

@media(max-width:850px){.certificates-grid{grid-template-columns:1fr}}
@media(max-width:700px){
  .navbar{padding:14px 5%}
  .nav-links{gap:15px}
  .nav-links li:nth-child(1){display:none}
  .header{padding:70px 0 38px}
  .toolbar{align-items:stretch}
  .search-box{min-width:100%}
  .filters{width:100%}
  .filter-btn{flex:1}
  .cert-image-wrap{height:200px}
}
@media(max-width:520px){
  .cert-heading{flex-direction:column;gap:4px}
  .date{padding:0}
  .detail-grid{grid-template-columns:1fr}
  .modal-header,.modal-body{padding:20px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

</head>
<body class="dark">
<nav class="navbar">
  <a href="index.html" class="nav-logo">Vivek Jaiswal</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="projects1.html">Projects</a></li>
    <li><a href="certificate.html" aria-current="page">Certificates</a></li>
  </ul>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
    <i class="fas fa-sun"></i>
  </button>
</nav>

<main class="container">
  <header class="header">
    <div class="header-badge"><span class="pulse-dot"></span> Credentials &amp; Training</div>
    <h1>Certificates</h1>
    <p>A focused record of completed training and professional credentials.</p>
  </header>

  <section class="toolbar" aria-label="Certificate filters">
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input class="search-input" id="searchInput" type="search" placeholder="Search certificates..." aria-label="Search certificates">
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="development">Development</button>
      <button class="filter-btn" data-filter="data">Data</button>
    </div>
  </section>

  <section class="certificates-grid" id="certificatesGrid" aria-live="polite"></section>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div class="modal-title">
        <h2 id="modalTitle"></h2>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <button class="close-btn" id="closeModal" type="button" aria-label="Close details">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>


<script>
const certificates = [
  {
    id: 1,
    title: "Web Programming Certificate",
    issuer: "Professional Institute",
    category: "development",
    date: "2024",
    credentialId: "WEB-PROG-2024-001",
    skills: ["HTML", "CSS", "JavaScript", "Web Development", "Programming"],
    image: "web program.jpg"
  },
  {
    id: 2,
    title: "MS Excel Certificate",
    issuer: "Microsoft Office Specialist",
    category: "data",
    date: "2024",
    credentialId: "MS-EXCEL-2024-002",
    skills: ["Excel", "Spreadsheets", "Data Analysis", "Formulas", "Pivot Tables"],
    image: "ms-excel.jpg"
  }
];

const grid = document.getElementById("certificatesGrid");
const searchInput = document.getElementById("searchInput");

function renderCertificates(filter = "all", search = "") {
  const query = search.trim().toLowerCase();

  const filtered = certificates.filter(cert => {
    const categoryMatch = filter === "all" || cert.category === filter;
    const searchMatch = !query ||
      cert.title.toLowerCase().includes(query) ||
      cert.issuer.toLowerCase().includes(query) ||
      cert.skills.some(skill => skill.toLowerCase().includes(query));
    return categoryMatch && searchMatch;
  });

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-search"></i>
        <h3>No certificates found</h3>
        <p>Try another search or category.</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(cert => `
    <article class="cert-card">
      <div class="cert-image-wrap">
        <img src="${cert.image}" alt="${cert.title}" class="cert-image">
        <span class="category-tag">${cert.category === "development" ? "Development" : "Data"}</span>
      </div>

      <div class="cert-content">
        <div class="cert-heading">
          <div>
            <h2>${cert.title}</h2>
            <p class="issuer">${cert.issuer}</p>
          </div>
          <span class="date">${cert.date}</span>
        </div>

        <p class="credential">Credential ID: ${cert.credentialId}</p>

        <div class="skills">
          ${cert.skills.map(skill => `<span>${skill}</span>`).join("")}
        </div>

        <button class="details-btn" type="button" onclick="viewDetails(${cert.id})">
          View Details <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </article>
  `).join("");
}

function viewDetails(id) {
  const cert = certificates.find(item => item.id === id);
  if (!cert) return;

  document.getElementById("modalTitle").textContent = cert.title;
  document.getElementById("modalSubtitle").textContent = cert.issuer;
  document.getElementById("modalBody").innerHTML = `
    <img src="${cert.image}" alt="${cert.title}" class="modal-cert-image">
    <div class="detail-grid">
      <div><span>Category</span><strong>${cert.category === "development" ? "Development" : "Data"}</strong></div>
      <div><span>Issued</span><strong>${cert.date}</strong></div>
      <div><span>Credential ID</span><strong>${cert.credentialId}</strong></div>
    </div>
    <h3>Skills Covered</h3>
    <div class="skills modal-skills">
      ${cert.skills.map(skill => `<span>${skill}</span>`).join("")}
    </div>
  `;

  document.getElementById("modalOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
  document.body.style.overflow = "";
}

document.querySelectorAll(".filter-btn").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
    renderCertificates(button.dataset.filter, searchInput.value);
  });
});

searchInput.addEventListener("input", () => {
  const active = document.querySelector(".filter-btn.active");
  renderCertificates(active ? active.dataset.filter : "all", searchInput.value);
});

document.getElementById("closeModal").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", event => {
  if (event.target.id === "modalOverlay") closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

// Same theme behavior as the main portfolio: one icon, body.dark, persistent choice.
(function () {
  const button = document.getElementById("themeToggle");
  const icon = button ? button.querySelector("i") : null;

  function setTheme(theme) {
    const dark = theme === "dark";
    document.body.classList.toggle("dark", dark);
    localStorage.setItem("theme", dark ? "dark" : "light");
    if (icon) icon.className = dark ? "fas fa-sun" : "fas fa-moon";
    if (button) button.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }

  setTheme(localStorage.getItem("theme") === "light" ? "light" : "dark");

  if (button) {
    button.addEventListener("click", () => {
      setTheme(document.body.classList.contains("dark") ? "light" : "dark");
    });
  }
})();

renderCertificates();
</script>

</body>
</html>
